name: Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/frontend/Balagh/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: mobile/frontend/Balagh
        run: npm ci --legacy-peer-deps

      - name: Security — forbidden API check
        working-directory: mobile/frontend/Balagh/src
        run: |
          FORBIDDEN_PATTERNS=(
            'react-native-camera'
            'react-native-vision-camera'
            'expo-camera'
            'react-native-audio'
            'react-native-sound'
            'expo-audio'
            'expo-av'
            'react-native-video'
            'MediaRecorder'
            'AudioContext'
            'getUserMedia'
            'react-native-contacts'
            'expo-contacts'
            'react-native-calendar-events'
            'expo-calendar'
            'react-native-advertising-id'
            '@react-native-community/geolocation'
            'BackgroundLocation'
            'background-location'
          )
          FOUND=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            matches=$(grep -rl "$pattern" . --include="*.ts" --include="*.tsx" --include="*.js" || true)
            if [ -n "$matches" ]; then
              echo "FORBIDDEN IMPORT DETECTED: '$pattern'"
              echo "$matches"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "Build blocked: forbidden API imports found."
            exit 1
          fi

          echo "Security check passed."

      - name: Download fonts
        working-directory: mobile/frontend/Balagh/assets/fonts
        run: |
          curl -fsSL -o /tmp/ibm.zip https://github.com/IBM/plex/releases/download/v6.4.0/IBM-Plex-Sans-Arabic.zip
          unzip -jo /tmp/ibm.zip "IBM-Plex-Sans-Arabic/fonts/ttf/*" -d .

          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          unzip -jo /tmp/inter.zip "extras/ttf/*.ttf" -d .

          curl -fsSL -o /tmp/jbmono.zip https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          unzip -jo /tmp/jbmono.zip "fonts/ttf/*.ttf" -d .

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Write release keystore (if secret provided)
        working-directory: mobile/frontend/Balagh/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            cat > keystore.properties <<EOF
storeFile=release.keystore
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF
          fi

      - name: Make gradlew executable
        working-directory: mobile/frontend/Balagh/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: mobile/frontend/Balagh/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: balagh-release-apk
          path: mobile/frontend/Balagh/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/frontend/Balagh/android/app/build/outputs/apk/release/*.apk
