name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - mobile/frontend/**
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    # Opt in to Node.js 24 action runner now — GitHub is forcing this for
    # all actions on June 2 2026, and Node 20 runs are already deprecated.
    # This env var does NOT affect the build Node.js version (set below to 22).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/frontend/Balagh/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: mobile/frontend/Balagh
        run: npm ci --legacy-peer-deps

      - name: Write Mapbox public token
        working-directory: mobile/frontend/Balagh/src/core
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
            echo "::error::MAPBOX_PUBLIC_TOKEN secret is not set. Add it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          printf 'export const MAPBOX_PUBLIC_TOKEN = %s;\n' "'${MAPBOX_PUBLIC_TOKEN}'" > mapboxToken.ts
          echo "mapboxToken.ts written from secret."

      - name: Security — forbidden API check
        working-directory: mobile/frontend/Balagh/src
        run: |
          FORBIDDEN_PATTERNS=(
            'react-native-camera'
            'react-native-vision-camera'
            'expo-camera'
            'react-native-audio'
            'react-native-sound'
            'expo-audio'
            'expo-av'
            'react-native-video'
            'MediaRecorder'
            'AudioContext'
            'getUserMedia'
            'react-native-contacts'
            'expo-contacts'
            'react-native-calendar-events'
            'expo-calendar'
            'react-native-advertising-id'
            '@react-native-community/geolocation'
            'BackgroundLocation'
            'background-location'
          )
          FOUND=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            matches=$(grep -rl "$pattern" . --include="*.ts" --include="*.tsx" --include="*.js" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "FORBIDDEN IMPORT DETECTED: '$pattern'"
              echo "$matches"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "Build blocked: forbidden API imports found. See above."
            exit 1
          fi
          echo "Security check passed — no forbidden APIs detected."

      - name: Download fonts
        working-directory: mobile/frontend/Balagh/assets/fonts
        run: |
          # IBM Plex Sans Arabic (v6.4.0 release)
          curl -fsSL -o /tmp/ibm-plex-arabic.zip \
            "https://github.com/IBM/plex/releases/download/v6.4.0/IBM-Plex-Sans-Arabic.zip"
          unzip -jo /tmp/ibm-plex-arabic.zip \
            "IBM-Plex-Sans-Arabic/fonts/ttf/IBMPlexSansArabic-Regular.ttf" \
            "IBM-Plex-Sans-Arabic/fonts/ttf/IBMPlexSansArabic-Medium.ttf" \
            "IBM-Plex-Sans-Arabic/fonts/ttf/IBMPlexSansArabic-SemiBold.ttf" \
            "IBM-Plex-Sans-Arabic/fonts/ttf/IBMPlexSansArabic-Bold.ttf" \
            -d .

          # Inter (v4.0 release)
          curl -fsSL -o /tmp/inter.zip \
            "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip"
          unzip -jo /tmp/inter.zip \
            "extras/ttf/Inter-Regular.ttf" \
            "extras/ttf/Inter-Medium.ttf" \
            "extras/ttf/Inter-SemiBold.ttf" \
            "extras/ttf/Inter-Bold.ttf" \
            -d .

          # JetBrains Mono (v2.304 release)
          curl -fsSL -o /tmp/jbmono.zip \
            "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"
          unzip -jo /tmp/jbmono.zip "fonts/ttf/JetBrainsMono-Regular.ttf" -d .

          echo "Fonts downloaded:"
          ls -lh .

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/frontend/Balagh/android/**/*.gradle*', 'mobile/frontend/Balagh/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write Mapbox download token to Gradle properties
        env:
          MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOAD_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOAD_TOKEN secret is not set. Add it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          mkdir -p ~/.gradle
          # Write token both as a Gradle property (read by build.gradle's
          # project.findProperty) AND keep it as an env var (read by
          # System.getenv). Belt-and-suspenders: Gradle resolves credentials
          # during configuration — before env vars are always visible.
          grep -v '^MAPBOX_DOWNLOAD_TOKEN' ~/.gradle/gradle.properties 2>/dev/null > /tmp/gradle.properties.tmp || true
          echo "MAPBOX_DOWNLOAD_TOKEN=${MAPBOX_DOWNLOAD_TOKEN}" >> /tmp/gradle.properties.tmp
          mv /tmp/gradle.properties.tmp ~/.gradle/gradle.properties
          echo "Mapbox download token written to ~/.gradle/gradle.properties"

      - name: Write release keystore (if secret provided)
        working-directory: mobile/frontend/Balagh/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            # Strip any leading whitespace that heredoc indentation can introduce.
            cat > keystore.properties << 'PROPS'
          storeFile=release.keystore
          PROPS
            sed -i 's/^ *//' keystore.properties
            echo "storePassword=${KEYSTORE_PASSWORD}" >> keystore.properties
            echo "keyAlias=${KEY_ALIAS}" >> keystore.properties
            echo "keyPassword=${KEY_PASSWORD}" >> keystore.properties
            echo "Release keystore configured."
          else
            echo "No KEYSTORE_BASE64 secret found — using debug keystore for release build."
          fi

      - name: Make gradlew executable
        working-directory: mobile/frontend/Balagh/android
        run: chmod +x gradlew

      - name: Build Release APK (arm64-v8a + x86_64)
        working-directory: mobile/frontend/Balagh/android
        env:
          MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
        # Build only the two modern 64-bit ABIs in CI.
        # armeabi-v7a and x86 are included in the full release via Play Store
        # delivery; building all 4 on a stock runner risks OOM / timeout.
        # The resulting APK works on every device released after 2017.
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --no-daemon \
            --max-workers=2

      - name: Locate APK (diagnostic)
        if: always()
        run: |
          echo "=== APK output directory ==="
          find mobile/frontend/Balagh/android/app/build/outputs/apk \
               -name "*.apk" 2>/dev/null \
            || echo "(no .apk files found — build may have failed)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: balagh-release-apk
          # Use ** so subdirectories (per-ABI split paths) are also matched.
          path: mobile/frontend/Balagh/android/app/build/outputs/apk/release/**/*.apk
          retention-days: 30
          # Fail loudly if the build did not produce any APK, rather than
          # silently uploading nothing (the default is "warn").
          if-no-files-found: error

      - name: Upload APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/frontend/Balagh/android/app/build/outputs/apk/release/**/*.apk
