services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: balagh
      POSTGRES_USER: balagh
      POSTGRES_PASSWORD: balagh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balagh -d balagh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
